name: Incoming PR
run-name: PR opened by ${{ github.actor }}
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [dev]
    paths:
      - 'com-azk-it-snowflake/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

jobs:
  run-snowflake-test-dbt-job:
    name: "Run on Incoming PR"
    runs-on: ubuntu-latest
    environment: dev # Must match the OIDC subject's environment
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }} # Snowflake password is required if you aren't using OIDC
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA }}

    steps:
      # Check out repository code with depth 0 for full git diff comparison against origin/main
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with: # Ensures Snowflake CLI will search for OIDC users matching this subject
          use-oidc: true

      - name: Check Snowflake CLI Version
        run: snow --version

      # The -x is shorthand for --temporary-connection
      - name: Test Connection
        run: snow connection test -x

      - name: Create tester dbt project object
        run: |
          snow dbt deploy tester_com_azk_it_snowflake_object \
            --source ./com-azk-it-snowflake \
            --dbt-version 1.10.15 \
            --force -x

      # Pattern 2: PR 변경 파일 검증
      - name: Check Changed Procedures and Tasks
        run: |
          echo "=== Changed SQL Files in this PR ==="
          git diff --name-only --diff-filter=ACMR origin/main...HEAD -- 'com-azk-it-snowflake/sql' || true

      # Builds all models and runs tests in DAG order on dev target
      - name: Build and test dbt project
        run: snow dbt execute -x tester_com_azk_it_snowflake_object build --target dev
