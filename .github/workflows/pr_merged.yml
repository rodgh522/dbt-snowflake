name: PR Accepted Deployment
run-name: PR from ${{ github.actor }} accepted - triggered a ${{ github.event_name }}
on:
  push:
    branches: [ dev ]
    paths:
      - 'com-azk-it-snowflake/**'
      - '.github/workflows/**'

permissions:
  contents: read
  id-token: write

jobs:
  run-snowflake-dbt-job:
    name: "Run on Accepted PR"
    runs-on: ubuntu-latest
    environment: dev # Must match the OIDC subject's environment
    env:
      SNOWFLAKE_CLI_FEATURES_ENABLE_DBT: true
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      # SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PAT }} # Snowflake password is required if you aren't using OIDC
      SNOWFLAKE_DATABASE: ${{ vars.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_SCHEMA: ${{ vars.SNOWFLAKE_SCHEMA }}

    steps:
      # Check out repository code with depth 2 to enable git diff HEAD~1
      - name: Check out repository code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install Snowflake CLI
        uses: snowflakedb/snowflake-cli-action@v2.0
        with: # Ensures Snowflake CLI will search for OIDC users matching this subject
          use-oidc: true

      - name: Check Snowflake CLI Version
        run: snow --version

      # The -x is shorthand for --temporary-connection
      - name: Test Connection
        run: snow connection test -x

      # Deploy dbt project object
      - name: Deploy com-azk-it-snowflake dbt project object
        run: |
          snow dbt deploy com_azk_it_snowflake_object \
            --source ./com-azk-it-snowflake \
            --default-target prod \
            --dbt-version 1.10.15 \
            --force -x

      # Pattern 2: Git Diff 기반 변경된 Stored Procedures 및 Tasks 선별 배포
      - name: Deploy Changed Procedures and Tasks (Pattern 2)
        run: |
          ./com-azk-it-snowflake/deploy_diff.sh HEAD~1

      - name: List Snowflake dbt project objects
        run: snow dbt list -x
