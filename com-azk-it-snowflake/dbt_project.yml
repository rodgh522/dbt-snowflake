name: 'com_azk_it_snowflake'
version: '1.0.0'
config-version: 2

profile: 'com_azk_it_snowflake'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  com_azk_it_snowflake:
    silver:
      +materialized: table
      +table_type: "iceberg"
      # +external_volume: "{{ 'EXT_VOL_SILVER_S3' if target.name == 'prod' else none }}"
      +database: "{{ 'DBT_TEST' if target.name == 'prod' else target.database }}"
      +schema: "{{ 'AIBI_SILVER' if target.name == 'prod' else target.schema }}"
      +snowflake_warehouse: "{{ 'SNOWFLAKE_LEARNING_WH' if target.name == 'prod' else target.warehouse }}"
    gold:
      +materialized: table
      +table_type: "iceberg"
      # +external_volume: "{{ 'EXT_VOL_GOLD_S3' if target.name == 'prod' else none }}"
      +database: "{{ 'DBT_TEST' if target.name == 'prod' else target.database }}"
      +schema: "{{ 'AIBI_GOLD' if target.name == 'prod' else target.schema }}"
      +snowflake_warehouse: "{{ 'SNOWFLAKE_LEARNING_WH' if target.name == 'prod' else target.warehouse }}"
