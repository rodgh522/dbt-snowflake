version: 2

models:
  - name: stg_patient_progress_brands_enhertu
    description: "Enhertu 브랜드 신환 진행 현황 Staging/Bronze Iceberg 테이블"
    columns:
      - name: _line
        description: "원천 레코드 라인 식별자 (Primary Key)"
        tests:
          - unique
          - not_null
      - name: brand
        description: "브랜드명 (Enhertu)"
        tests:
          - not_null
      - name: new_pts
        description: "신규 환자 수"
      - name: hospital_name
        description: "병원명 (HCA)"

  - name: stg_patient_progress_brands_tagrisso
    description: "Tagrisso 브랜드 신환 진행 현황 Staging/Bronze Iceberg 테이블"
    columns:
      - name: _line
        description: "원천 레코드 라인 식별자 (Primary Key)"
        tests:
          - unique
          - not_null
      - name: brand
        description: "브랜드명 (Tagrisso)"
        tests:
          - not_null
      - name: new_pts
        description: "신규 환자 수"
      - name: hospital_name
        description: "병원명 (HCA)"

  - name: patient_progress_brands_all
    description: "Enhertu 및 Tagrisso 브랜드를 표준 스키마로 UNION ALL 통합한 Bronze Iceberg 테이블"
    columns:
      - name: brand
        description: "브랜드명 (Enhertu / Tagrisso)"
        tests:
          - not_null
      - name: new_pts
        description: "신규 환자 수"
      - name: hospital_name
        description: "병원명 (HCA)"
