          - not_null
      - name: criteria
        description: "지출 기준"
      - name: main_players
        description: "주요 경쟁사/플레이어"
      - name: year
        description: "4자리 연도"
        tests:
          - not_null
      - name: mm
        description: "2자리 월"
        tests:
          - not_null
      - name: yyyymmdd
        description: "기준월 1일자 (YYYY-MM-01)"
        tests:
          - not_null
      - name: spending_amt
        description: "지출 금액"

