    description: "Silver 계층 브랜드 참조 테이블"
    columns:
      - name: material_code
        description: "자재 고유 코드"
        data_tests:
          - unique
          - not_null

  - name: inv_material_master
    description: "Silver 계층 공급망 자재 마스터 테이블"
    columns:
      - name: material_code
        description: "자재 고유 코드 (Primary Key)"
        data_tests:
          - unique
          - not_null
      - name: product_code_global
        data_tests:
          - not_null
